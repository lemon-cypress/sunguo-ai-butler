<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>松果早报</title>
    <link rel="stylesheet" href="./styles.css?v=brief-v13-20260721" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="松果早报">
        <div>
          <h1>松果早报</h1>
        </div>
        <div class="status-strip">
          <span id="dateLabel">加载中</span>
          <span id="cityLabel">北京-朝阳</span>
        </div>
      </section>

      <section class="module todo-module" aria-label="待办事项">
        <div class="section-heading">
          <h2>待办</h2>
          <button id="deleteSelectedBtn" type="button" class="ghost-button">删除选定</button>
        </div>
        <div id="todoList" class="todo-list"></div>
        <form id="todoForm" class="todo-form">
          <input id="todoTitleInput" type="text" placeholder="新增待办事项" />
          <input id="todoNoteInput" type="text" placeholder="补充说明（可选）" />
          <button type="submit">新增</button>
        </form>
      </section>

      <section class="module stock-module" aria-label="自选">
        <div class="section-heading">
          <h2>自选</h2>
          <button id="refreshStocksBtn" type="button" class="ghost-button">刷新数据</button>
        </div>
        <p class="stock-help">仅自选 A 股会进入新闻定向关注。价格为投资数据网提供的最新交易日收盘价，不等同于盘中实时行情。</p>
        <form id="stockSearchForm" class="stock-search-form">
          <input id="stockSearchInput" type="text" placeholder="输入 A 股代码或已自选股票名称，如 000568" autocomplete="off" />
          <button type="submit">搜索并加入</button>
        </form>
        <div id="stockSearchResults" class="stock-search-results"></div>
        <div id="stockWatchlist" class="stock-watchlist"></div>
      </section>

      <section class="module news-module" aria-label="当日新闻">
        <div class="section-heading">
          <h2>新闻</h2>
          <div class="news-source-strip" id="newsSourceStrip"></div>
        </div>
        <div id="newsSections" class="news-sections"></div>
      </section>
    </main>

    <script src="./app.js?v=brief-v13-20260721"></script>
  </body>
</html>
