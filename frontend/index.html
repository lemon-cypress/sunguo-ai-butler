<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>松果早报</title>
    <link rel="stylesheet" href="./styles.css?v=brief-v11-20260714" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar" aria-label="松果早报">
        <div>
          <h1>松果早报</h1>
        </div>
        <div class="status-strip">
          <span id="dateLabel">加载中</span>
          <span id="cityLabel">北京-朝阳</span>
        </div>
      </section>

      <section class="module todo-module" aria-label="待办事项">
        <div class="section-heading">
          <h2>待办</h2>
          <button id="deleteSelectedBtn" type="button" class="ghost-button">删除选定</button>
        </div>
        <div id="todoList" class="todo-list"></div>
        <form id="todoForm" class="todo-form">
          <input id="todoTitleInput" type="text" placeholder="新增待办事项" />
          <input id="todoNoteInput" type="text" placeholder="补充说明（可选）" />
          <button type="submit">新增</button>
        </form>
      </section>

      <section class="module news-module" aria-label="当日新闻">
        <div class="section-heading">
          <h2>新闻</h2>
          <div class="news-source-strip" id="newsSourceStrip"></div>
        </div>
        <div id="newsSections" class="news-sections"></div>
      </section>
    </main>

    <script src="./app.js?v=brief-v11-20260714"></script>
  </body>
</html>
